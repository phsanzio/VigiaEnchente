spring:
  application:
    name: vigiaenchente-api

  datasource:
    url: jdbc:postgresql://localhost:5432/vigiaenchente
    username: ${DB_USERNAME:vigiaenchente}
    password: ${DB_PASSWORD:vigiaenchente}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Configurações das APIs externas
openmeteo:
  flood:
    base-url: https://flood-api.open-meteo.com/v1/flood
  weather:
    base-url: https://archive-api.open-meteo.com/v1/archive
  forecast:
    base-url: https://api.open-meteo.com/v1/forecast

# Coordenadas padrão - Sabará/MG
sabara:
  latitude: -19.88
  longitude: -43.80

logging:
  level:
    com.vigiaenchente: DEBUG
    org.hibernate.SQL: WARN

# JWT
jwt:
  secret: ${JWT_SECRET:minha-chave-secreta-temporaria-trocar-em-producao-pelo-amor-de-deus}
  expiration: 86400000  # 24 horas em milissegundos
